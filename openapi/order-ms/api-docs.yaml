openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/orders:
    get:
      tags:
      - order-controller
      operationId: getAllOrders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      tags:
      - order-controller
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequestModel"
        required: true
      responses:
        "200":
          description: OK
  /api/orders/{id}:
    get:
      tags:
      - order-controller
      operationId: getOrder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    CreateOrderRequestModel:
      type: object
      properties:
        productId:
          type: string
        amount:
          type: integer
          format: int32
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: string
        amount:
          type: integer
          format: int32
        status:
          $ref: "#/components/schemas/OrderStatus"
        orderStatusId:
          type: string
    OrderStatus:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
